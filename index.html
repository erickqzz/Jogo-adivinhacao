<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
    background-color: #e3f2fd;
    font-family: Arial, sans-serif;
}

.container {
    width: 350px;
    margin: 80px auto;
    background-color: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

h1 {
    color: #1976d2;
}

input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
}

button {
    padding: 10px 20px;
    background-color: #1976d2;
    color: white;
    border: none;
    border-radius: 5px;
}

button:hover {
    background-color: #1565c0;
}
#result{
  white-space: pre-line;
}
    </style>
  </head>

  <body>
    <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Jogo de Adivinhação kkk</h1>

        <p>Estou pensando em um número entre 1 e 100.</p>

        <input type="number" id="guessInput" placeholder="Digite um número">

        <button id="botaoadivinhar">
            Adivinhar
        </button>

        <p id="result"></p>
      <p id="historico"></p>
    </div>

</body>
</html>
    <script>
      // Gera um número aleatório entre 1 e 100
let numeroSecreto = Math.floor(Math.random() * 100) + 1;

let tentativas = 0;
let historico = [];
let limiteTentativas = 5;

function guessNumber() {

    let chute = Number(document.getElementById("guessInput").value);

    let resultado = document.getElementById("result");
    let historicoTexto = document.getElementById("historico");

    // Verifica se o número é válido
    if (chute < 1 || chute > 100 || isNaN(chute)) {
        resultado.textContent = "Digite um número entre 1 e 100.";
        return;
    }

    // Conta a tentativa e salva no histórico
    tentativas++;
    historico.push(chute);

    historicoTexto.textContent = "Histórico: " + historico.join(", ");

    // Verifica se acertou
    if (chute === numeroSecreto) {

        resultado.textContent = "Acertou! fez o minímo igual ela fez por vc! 👍 " + tentativas + " tentativas!";

        // Reinicia o jogo
        numeroSecreto = Math.floor(Math.random() * 100) + 1;
        tentativas = 0;
        historico = [];

    }

    // Verifica se acabou as tentativas
    else if (tentativas >= limiteTentativas) {

        resultado.textContent = " Perdeu otário kkkk\nEra: " + numeroSecreto;

        // Reinicia o jogo
        numeroSecreto = Math.floor(Math.random() * 100) + 1;
        tentativas = 0;
        historico = [];

    }

    // Dicas
    else if (chute < numeroSecreto) {

        resultado.textContent =  "📈 Tá mirando onde? No rodapé da tela? KKK"

    }

    else {

        resultado.textContent = "📉 Abaixa esse chute, tá mais perdido que o thaciano em campo";

      document.getElementById("botaoadivinhar").addEventListener("click",guessNumber);

    }

}
    </script>
  </body>
</html>
